<title>Nieuwe fvdwpartijhandel.nl</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&family=Barlow+Condensed:wght@500;600;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
/* Layout: brand website of the existing house style (white header, cyan top bar, navy footer), wrapped in a thin dark demo bar. Single light theme on purpose: it mirrors the live site. */
:root{
  --blue:#0060F0; --navy:#0E2B5D; --cyan:#4BD7E3; --ice:#EDF8FF;
  --ink:#0B1730; --muted:#4F5F7A; --line:#D5E4F2; --paper:#FFFFFF; --ground:#F6FAFE;
  --ok:#0E7A4F; --warn:#9A5B00; --warnbg:#FFF4DE;
  --demo:#111A2E; --demofg:#E6EEF9;
  --f-body:'Montserrat',Arial,Helvetica,sans-serif;
  --f-label:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --r-pill:60px; --r-card:14px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--ground);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.55;margin:0}
a{color:var(--blue)}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px}
h1,h2,h3{text-wrap:balance;line-height:1.15;margin:0}
.lbl{font-family:var(--f-label);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.num{font-variant-numeric:tabular-nums}

/* demo bar */
@media (max-width:700px){.demo{position:static!important}}
.demo{background:var(--demo);color:var(--demofg);font-size:13px;position:sticky;top:env(safe-area-inset-top,0px);z-index:40}
.demo .wrap{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding-block:8px}
.demo .tag{font-family:var(--f-label);font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:var(--cyan);color:var(--demo);padding:2px 8px;border-radius:4px}
.demo .grp{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.demo .grp span{opacity:.7;margin-right:2px}
.demo button{background:transparent;color:var(--demofg);border:1px solid #3A4A6B;border-radius:6px;padding:4px 10px;cursor:pointer;font-size:12.5px}
.demo button[aria-pressed="true"]{background:var(--demofg);color:var(--demo);border-color:var(--demofg)}
.demo .sp{flex:1}
.badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--cyan);color:var(--demo);font-weight:700;font-size:11px;text-align:center;margin-left:4px}

/* site header */
.top{background:var(--cyan)}
.top .wrap{display:flex;gap:4px 22px;flex-wrap:wrap;align-items:center;min-height:38px;padding-block:4px}
.top a{color:var(--blue);font-weight:600;text-decoration:none;font-size:15px;cursor:pointer}
.top a:hover,.top a.on{color:var(--navy)}
.top .langs{margin-left:auto;display:flex;gap:6px}
.top .langs button{border:0;background:transparent;font-weight:700;color:var(--blue);cursor:pointer;padding:2px 4px;border-radius:4px}
.top .langs button.on{background:var(--paper);color:var(--navy)}
.hdr{background:var(--paper);border-bottom:1px solid var(--line)}
.hdr .wrap{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding-block:14px}
.hdr .logo{height:44px;width:auto;cursor:pointer;max-width:100%}
.search{flex:1 1 220px;display:flex;background:var(--ice);border-radius:90px;padding:4px 6px 4px 18px;min-width:0}
.search input{flex:1;border:0;background:transparent;font:inherit;color:var(--blue);min-width:0;outline:none}
.search input::placeholder{color:var(--blue);opacity:.75}
.search button{border:0;background:var(--blue);color:#fff;border-radius:50%;width:34px;height:34px;cursor:pointer;flex:none}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:var(--r-pill);padding:11px 22px;font-size:15px;font-weight:600;cursor:pointer;text-decoration:none;color:#fff;background:var(--navy);white-space:nowrap}
.btn.cy{background:var(--cyan);color:var(--navy)}
.btn.bl{background:var(--blue)}
.btn.ghost{background:var(--ice);color:var(--navy)}
.btn:hover{filter:brightness(1.08)}
.btn.sm{padding:7px 14px;font-size:13.5px}
.qcount{background:#fff;color:var(--navy);border-radius:10px;padding:0 7px;font-size:12px;font-weight:800}

/* main */
main{min-height:60vh}
.hero{position:relative;background:var(--navy);color:#fff;overflow:hidden}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.45}
.hero .wrap{position:relative;padding-block:56px 48px;display:grid;gap:18px}
.hero h1{font-size:clamp(30px,5vw,52px);font-weight:900;text-transform:uppercase;letter-spacing:-.01em;max-width:18ch}
.hero p{font-size:clamp(16px,2vw,21px);max-width:44ch;margin:0}
.hero .ctas{display:flex;gap:10px;flex-wrap:wrap}
.facts{background:var(--paper);border-bottom:1px solid var(--line)}
.facts .wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0}
.facts div{padding:16px 18px;border-left:1px solid var(--line)}
.facts div:first-child{border-left:0}
.facts b{display:block;font-size:22px;color:var(--blue);font-weight:800}
.facts span{color:var(--muted);font-size:13.5px}
section.blk{padding-block:40px}
.sh{display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.sh h2{font-size:26px;font-weight:800;text-transform:uppercase;color:var(--navy)}
.sh p{margin:4px 0 0;color:var(--muted)}

/* product cards as pallet labels */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-card);overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-2px);box-shadow:0 10px 24px -14px rgba(14,43,93,.45)}
.card .ph{aspect-ratio:1/1;background:#fff;display:flex;align-items:center;justify-content:center;border-bottom:1px solid var(--line);position:relative;max-width:100%}
.card .ph img{width:100%;height:100%;object-fit:contain;padding:10px}
.card .body{padding:12px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.card h3{font-size:14.5px;font-weight:600;color:var(--ink);line-height:1.3}
.strip{display:grid;grid-template-columns:1fr 1fr;border-top:1px dashed var(--line);margin-top:auto;padding-top:8px;gap:4px 8px}
.strip div{min-width:0}
.strip .k{font-family:var(--f-label);text-transform:uppercase;letter-spacing:.06em;font-size:11.5px;color:var(--muted);display:block}
.strip .v{font-weight:700;font-size:13.5px;font-variant-numeric:tabular-nums}
.price{font-weight:800;color:var(--navy);font-size:17px;font-variant-numeric:tabular-nums}
.price small{font-weight:500;color:var(--muted);font-size:12px}
.lock{font-size:13px;color:var(--blue);font-weight:600}
.pill{position:absolute;top:8px;left:8px;font-family:var(--f-label);text-transform:uppercase;letter-spacing:.05em;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:5px;background:var(--navy);color:#fff}
.pill.cy{background:var(--cyan);color:var(--navy)}
.pill.wn{background:var(--warnbg);color:var(--warn)}

.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.cat{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;align-items:baseline;text-align:left;font:inherit;color:var(--ink)}
.cat:hover{border-color:var(--blue);color:var(--blue)}
.cat b{font-weight:600}
.cat span{font-family:var(--f-label);color:var(--muted);font-size:15px}

.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.panel{border-radius:25px;padding:26px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.panel h3{font-size:22px;font-weight:800;text-transform:uppercase}
.panel.b{background:var(--blue);color:#fff}
.panel.c{background:var(--cyan);color:var(--navy)}
.panel.i{background:var(--ice);color:var(--navy)}
.panel p{margin:0}
.agenda-row{display:flex;gap:14px;align-items:center;padding:10px 0;border-bottom:1px solid rgba(14,43,93,.18);width:100%}
.agenda-row .d{font-family:var(--f-label);font-weight:700;font-size:20px;min-width:92px}

/* catalogue */
.cat-layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:820px){.cat-layout{grid-template-columns:minmax(0,1fr)}}
.side{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-card);padding:10px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 52px)}
@media (max-width:820px){.side{position:static}}
.side button{display:flex;justify-content:space-between;width:100%;border:0;background:transparent;text-align:left;padding:7px 10px;border-radius:8px;cursor:pointer;color:var(--ink);font-size:14px;gap:8px}
.side button:hover{background:var(--ice)}
.side button.on{background:var(--navy);color:#fff}
.side button.sub{padding-left:22px;font-size:13px;color:var(--muted)}
.side button.sub.on{background:var(--ice);color:var(--navy);font-weight:600}
.side .n{font-family:var(--f-label);opacity:.8}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.toolbar select,.field input,.field select,.field textarea{font:inherit;border:1px solid var(--line);border-radius:30px;padding:9px 14px;background:var(--paper);color:var(--ink)}
.field textarea{border-radius:16px;min-height:90px;width:100%}
.note{background:var(--ice);border-radius:12px;padding:12px 14px;color:var(--navy);font-size:13.5px}
.note.wn{background:var(--warnbg);color:var(--warn)}

/* product page */
.pd{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px;align-items:start}
@media (max-width:820px){.pd{grid-template-columns:minmax(0,1fr)}}
.pd .ph{background:#fff;border:1px solid var(--line);border-radius:var(--r-card);aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;max-width:100%}
.pd .ph img{width:100%;height:100%;object-fit:contain;padding:24px}
.pd h1{font-size:clamp(22px,3vw,30px);font-weight:800;color:var(--navy)}
.label{border:2px solid var(--navy);border-radius:10px;overflow:hidden;background:var(--paper)}
.label .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
.label .row div{padding:10px 12px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-width:0}
.label .k{font-family:var(--f-label);text-transform:uppercase;letter-spacing:.06em;font-size:12px;color:var(--muted);display:block}
.label .v{font-weight:700;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.label .bar{background:var(--navy);color:#fff;padding:6px 12px;font-family:var(--f-label);letter-spacing:.1em;text-transform:uppercase;font-weight:600;font-size:13px;display:flex;justify-content:space-between;gap:8px}
.qty{display:flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:30px;overflow:hidden;background:var(--paper)}
.qty button{border:0;background:var(--ice);width:38px;height:40px;font-size:18px;cursor:pointer;color:var(--navy)}
.qty input{width:56px;text-align:center;border:0;font:inherit;font-weight:700}

/* forms */
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px 16px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-weight:600;font-size:13.5px;color:var(--navy)}
.field.full{grid-column:1/-1}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.checks label{background:var(--ice);border-radius:20px;padding:5px 12px;font-size:13px;cursor:pointer;font-weight:500}
.checks input{margin-right:5px}
.box{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-card);padding:22px}
.ok{background:#E3F6EC;color:var(--ok);border-radius:12px;padding:14px 16px;font-weight:600}
table.t{border-collapse:collapse;width:100%;font-size:14px}
table.t th{text-align:left;font-family:var(--f-label);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:8px;border-bottom:2px solid var(--line)}
table.t td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto}
.st{display:inline-block;padding:2px 9px;border-radius:12px;font-size:12px;font-weight:700}
.st.a{background:var(--ice);color:var(--blue)}.st.g{background:#E3F6EC;color:var(--ok)}.st.o{background:var(--warnbg);color:var(--warn)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.tabs button{border:1px solid var(--line);background:var(--paper);border-radius:30px;padding:8px 16px;cursor:pointer;font-weight:600;color:var(--navy)}
.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.thumb{width:44px;height:44px;object-fit:contain;background:#fff;border:1px solid var(--line);border-radius:8px}

/* footer */
footer{background:var(--navy);color:#fff;margin-top:40px}
footer .wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:24px;padding-block:36px}
footer h4{margin:0 0 10px;text-transform:uppercase;font-weight:800;font-size:17px}
footer a{color:#fff;text-decoration:none;cursor:pointer;display:block;padding:2px 0}
footer p{margin:0;opacity:.9}
.copy{background:var(--cyan);color:#fff;font-size:13px}
.copy .wrap{padding-block:8px;display:block}

/* backstage drawer */
.drawer[hidden]{display:none}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--paper);border-left:1px solid var(--line);box-shadow:-20px 0 40px -20px rgba(14,43,93,.35);z-index:60;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer header{background:var(--demo);color:var(--demofg);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.drawer header button{background:transparent;color:var(--demofg);border:1px solid #3A4A6B;border-radius:6px;padding:4px 10px;cursor:pointer}
.drawer .in{overflow:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.ev{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px}
.ev .when{font-family:var(--f-label);color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-size:12px}
.ev pre{background:var(--ground);border-radius:8px;padding:8px;font-size:12px;overflow-x:auto;margin:8px 0 0;white-space:pre}
.src{font-size:13.5px;color:var(--muted)}
.src b{color:var(--navy)}

/* proposal */
.doc{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-card);padding:clamp(18px,4vw,44px);max-width:900px;margin:0 auto}
.doc h1{font-size:clamp(26px,4vw,36px);font-weight:900;color:var(--navy);text-transform:uppercase;margin-bottom:8px}
.doc h2{font-size:21px;font-weight:800;color:var(--navy);margin:34px 0 10px;text-transform:uppercase;letter-spacing:.01em}
.doc h3{font-size:17px;font-weight:700;color:var(--navy);margin:22px 0 8px}
.doc p,.doc li{max-width:72ch}
.doc em:first-of-type{color:var(--muted)}
.doc table{border-collapse:collapse;width:100%;font-size:14px;margin:8px 0}
.doc .tw{margin:8px 0}
.doc th{text-align:left;background:var(--ice);color:var(--navy);padding:8px 10px;font-weight:700}
.doc td{border-bottom:1px solid var(--line);padding:8px 10px;vertical-align:top}
.doc code{background:var(--ice);padding:1px 5px;border-radius:4px;font-size:.9em;overflow-wrap:anywhere}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="demo" role="region" aria-label="Voorbeeldbediening">
  <div class="wrap">
    <span class="tag">Voorbeeld</span>
    <span>Niet live. Huidige site blijft ongemoeid.</span>
    <span class="sp"></span>
    <div class="grp"><span>Bekijk als</span>
      <button id="as-guest" aria-pressed="true">Bezoeker</button>
      <button id="as-nl" aria-pressed="false">Klant uit NL</button>
      <button id="as-de" aria-pressed="false">Klant uit DE</button>
    </div>
    <div class="grp">
      <button id="go-voorstel" aria-pressed="false">Voorstel</button>
      <button id="go-backstage" aria-pressed="false">Achter de schermen<span class="badge" id="evcount">0</span></button>
    </div>
  </div>
</div>

<div class="top"><div class="wrap" id="topnav"></div></div>
<div class="hdr"><div class="wrap">
  <img class="logo" src="img/logo.png" alt="Frank van de Wijgert partijhandel" id="logo" width="309" height="44">
  <form class="search" id="searchform" role="search">
    <input id="q" type="search" autocomplete="off">
    <button aria-label="Zoeken" type="submit">⌕</button>
  </form>
  <div style="display:flex;gap:8px;flex-wrap:wrap" id="hdrbtns"></div>
</div></div>

<main id="main"></main>

<footer><div class="wrap" id="foot"></div></footer>
<div class="copy"><div class="wrap">Copyright fvdwpartijhandel | All Rights Reserved</div></div>

<aside class="drawer" id="drawer" hidden aria-label="Achter de schermen">
  <header><b>Achter de schermen</b><button id="closedrawer">Sluiten</button></header>
  <div class="in">
    <div class="src" id="srcinfo"></div>
    <div id="events"></div>
  </div>
</aside>

// Wat mag deze bezoeker zien? Dezelfde regels die de echte site in Supabase krijgt.
function visible(x){
  if(x.st==='publiek') return true;
  if(!S.user) return false;
  if(x.st==='niet_op_site') return D.mijn.includes(x.id);
  const benelux=['NL','BE','LU'], action=['NL','BE','DE','FR','PL'], L=S.user.land;
  for(const b of x.b){
    if(b.includes('Benelux') && benelux.includes(L)) return false;
    if(b.includes('Nederland') && L==='NL') return false;
    if(b.includes('België') && L==='BE') return false;
    if(b.includes('Action') && action.includes(L)) return false;
  }
  return true;
}
function catalog(){
  let l=D.items.filter(x=>visible(x)&&x.st!=='niet_op_site');
  if(S.cat) l=l.filter(x=>x.h===S.cat);
  if(S.sub) l=l.filter(x=>x.s===S.sub);
  if(S.q){const q=S.q.toLowerCase();l=l.filter(x=>(x.nl+' '+x.en+' '+x.de+' '+x.id+' '+x.ean).toLowerCase().includes(q))}
  const so={nieuw:(a,b)=>b.d.localeCompare(a.d),voorraad:(a,b)=>b.v-a.v,naam:(a,b)=>nm(a).localeCompare(nm(b))}[S.sort];
  return l.sort(so);
}
function log(title,body,table){
  S.events.unshift({when:new Date().toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'}),title,body,table});
  document.getElementById('evcount').textContent=S.events.length;
  renderDrawer();
}

/* ---------- pieces ---------- */
function priceHtml(x){
  if(!S.user) return `<span class="lock">🔒 ${t('prijsNa')}</span>`;
  return `<span class="price">${eur(x.p)} <small>${t('perSt')}</small></span>`;
}
function card(x){
  const pill=x.st==='niet_op_site'?`<span class="pill cy">${t('persoonlijk')}</span>`:x.st==='alleen_inlog'?`<span class="pill wn">${t('alleenInlog')}</span>`:'';
  return `<article class="card" data-p="${x.id}" tabindex="0">
   <div class="ph">${pill}<img loading="lazy" src="f/${x.id}.jpg" alt=""></div>
   <div class="body"><h3>${esc(nm(x))}</h3>${priceHtml(x)}
   <div class="strip"><div><span class="k">${t('voorraad')}</span><span class="v">${nf(x.v)}</span></div>
   <div><span class="k">${t('omdoos')}</span><span class="v">${x.om?x.om+' '+t('st'):'–'}</span></div></div></div></article>`;
}

   <div class="field full"><label>${t('interesse')}</label><div class="checks">${hoofd.map((c,i)=>`<label><input type="checkbox" ${i<3?'checked':''} value="${c.c}">${esc(c[S.lang])}</label>`).join('')}</div></div>

};

V.mijn=()=>{
  if(!S.user) return V.login();
  const tabs=['aanbod','offertes','orders','geg'];
  const lbl={aanbod:t('mAanbod'),offertes:t('mOffertes'),orders:t('mOrders'),geg:t('mGeg')};
  let body='';
  if(S.mijnTab==='aanbod'){body=`<div class="note" style="margin-bottom:14px">${t('aanbodP')}</div><div class="grid">${D.mijn.map(byId).map(card).join('')}</div>`}
  if(S.mijnTab==='offertes'){const rows=[...S.events.filter(e=>e.nr).map(e=>({nr:e.nr,d:'vandaag',s:'Aanvraag',c:'a',b:e.bedrag})),{nr:'OF-2026-0388',d:'24-09-2026',s:'Verstuurd',c:'o',b:1840},{nr:'OF-2026-0351',d:'11-09-2026',s:'Order geworden',c:'g',b:3215.5}];
    body=`<div class="box tw"><table class="t"><thead><tr><th>Nr</th><th>Datum</th><th>Status</th><th>Excl. btw</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.nr}</td><td>${r.d}</td><td><span class="st ${r.c}">${r.s}</span></td><td>${r.b!=null?eur(r.b):'–'}</td></tr>`).join('')}</tbody></table></div><p class="src">Voorbeeldregels. In de echte site komen deze uit de tabel <b>offertes</b> van het Salesbureau, alleen die van deze klant.</p>`}
  if(S.mijnTab==='orders'){body=`<div class="box tw"><table class="t"><thead><tr><th>Order</th><th>Datum</th><th>Status</th><th>Excl. btw</th></tr></thead><tbody>
    <tr><td>202600712</td><td>12-09-2026</td><td><span class="st g">Geleverd</span></td><td>${eur(3215.5)}</td></tr>
    <tr><td>202600644</td><td>21-08-2026</td><td><span class="st o">Te factureren</span></td><td>${eur(980)}</td></tr></tbody></table></div><p class="src">Voorbeeldregels. Statussen zijn die uit MyBusiness en het Salesbureau (In bewerking, Gereed, Geleverd, Te factureren, Afgesloten).</p>`}
  if(S.mijnTab==='geg'){body=`<div class="box"><div class="form"><div class="field"><label>${t('bedrijf')}</label><input value="${esc(S.user.naam)}" readonly></div><div class="field"><label>${t('land')}</label><input value="${S.user.land}" readonly></div><div class="field"><label>${t('kvk')}</label><input value="12345678" readonly></div><div class="field"><label>${t('btw')}</label><input value="${S.user.land}000000000B01" readonly></div></div><p class="src">Komt uit de tabel klanten. Wijzigingen gaan als verzoek naar Michel.</p></div>`}
  return `<section class="blk"><div class="wrap"><div class="sh"><div><h2>${t('welkom')}</h2><p>${esc(S.user.naam)} · ${S.user.land}</p></div><button class="btn ghost sm" data-act="logout">${t('logout')}</button></div>
   <div class="tabs">${tabs.map(k=>`<button class="${S.mijnTab===k?'on':''}" data-tab="${k}">${lbl[k]}</button>`).join('')}</div>${body}</div></section>`;
};
V.agenda=()=>`<section class="blk"><div class="wrap" style="max-width:900px"><div class="sh"><div><h2>${t('agenda')}</h2><p>${t('agendaP')}</p></div></div>
  <div class="box">${[...AGENDA,{d:'14 jan 2026',n:'SVG Fair',p:'Winterswijk',old:1},{d:'24 mrt 2026',n:'IAW Trade Fair',p:'Keulen',old:1},{d:'8 sep 2026',n:'IAW Trade Fair',p:'Keulen',old:1}].map(a=>`<div class="agenda-row" style="${a.old?'opacity:.55':''}"><span class="d">${a.d}</span><span><b>${a.n}</b> · ${a.p}</span>${a.old?'':'<span style="margin-left:auto"><button class="btn bl sm" data-act="beurs">Afspraak maken</button></span>'}</div>`).join('')}
  <p class="src" style="margin-top:12px">Week 45 is het magazijn gesloten; u kunt ons dan bezoeken op de SVG Fair in Winterswijk. Agenda-items worden in de nieuwe opzet in het Salesbureau beheerd.</p></div></div></section>`;
V.over=()=>`<section class="blk"><div class="wrap split" style="align-items:center">
  <div style="display:grid;gap:14px"><h2 style="color:var(--navy);font-size:30px;font-weight:900;text-transform:uppercase">${t('over')}</h2>

   <p style="margin:0">Rheastraat 19, 5047 TL Tilburg<br>+31 (0)13 57 11 75 5<br>info@fvdwpartijhandel.nl<br>WhatsApp +31 6 18 30 61 48</p>
   <table class="t"><tbody><tr><td>Ma–vr</td><td>08:00–17:00</td></tr><tr><td>Za</td><td>Op afspraak</td></tr><tr><td>Zo</td><td>Gesloten</td></tr></tbody></table></div>

   <div class="field"><label for="c-n">${t('naam')}</label><input id="c-n"></div><div class="field"><label for="c-b">${t('bedrijf')}</label><input id="c-b"></div>
   <div class="field"><label for="c-e">${t('email')}</label><input id="c-e" type="email"></div><div class="field"><label for="c-k">${t('kvk')}</label><input id="c-k"></div>
   <div class="field full"><label for="c-m">${t('opm')}</label><textarea id="c-m"></textarea></div></div><div><button class="btn bl" type="submit">${S.lang==='de'?'Senden':S.lang==='en'?'Send':'Verzenden'}</button></div></form>
  </div></section>`;
V.aanbieden=()=>`<section class="blk"><div class="wrap split">
  <img src="img/vrachtwagen.jpg" alt="" style="border-radius:25px;width:100%;max-width:100%;max-height:520px;object-fit:cover">
  <form class="box" id="aanbiedform" style="display:grid;gap:12px"><h2 style="color:var(--navy);font-weight:800;text-transform:uppercase">${t('aanbiedenT')}</h2><p style="margin:0">${t('aanbiedenP')}</p>
  <div class="form"><div class="field"><label for="a-b">${t('bedrijf')}</label><input id="a-b" value="Voorbeeld Leverancier"></div><div class="field"><label for="a-e">${t('email')}</label><input id="a-e" type="email" value="verkoop@voorbeeld.nl"></div>
  <div class="field full"><label for="a-o">${S.lang==='nl'?'Wat voor partij? (artikelen, aantallen, pallets, locatie)':'Describe the lot'}</label><textarea id="a-o">12 pallets tuinverlichting op zonne-energie, ca. 9.600 stuks, staat in Venlo.</textarea></div>
  <div class="field full"><label for="a-f">${S.lang==='nl'?"Foto's of lijst (Excel/PDF)":'Photos or list'}</label><input id="a-f" type="file" multiple></div></div>
  <div><button class="btn bl" type="submit">${S.lang==='de'?'Senden':S.lang==='en'?'Send':'Verzenden'}</button></div></form></div></section>`;
V.voorstel=()=>`<section class="blk"><div class="wrap"><article class="doc" id="doc"><p>Voorstel laden...</p></article></div></section>`;

/* ---------- render ---------- */
function render(){
  topnav();
  document.getElementById('main').innerHTML=(V[S.route]||V.home)();
  document.querySelectorAll('[aria-pressed]').forEach(b=>b.setAttribute('aria-pressed','false'));
  document.getElementById(S.user?(S.user.land==='DE'?'as-de':'as-nl'):'as-guest').setAttribute('aria-pressed','true');
  document.getElementById('go-voorstel').setAttribute('aria-pressed',S.route==='voorstel');
  document.getElementById('go-backstage').setAttribute('aria-pressed',!document.getElementById('drawer').hidden);
  const ss=document.getElementById('sortsel'); if(ss) ss.value=S.sort;
  if(S.route==='voorstel') loadDoc();
  renderDrawer();
}
let docMd=null;
async function loadDoc(){
  try{ if(!docMd){const r=await fetch('voorstel.md'); docMd=await r.text();}
    const el=document.getElementById('doc'); if(!el) return;
    el.innerHTML=window.marked?marked.parse(docMd):'<pre style="white-space:pre-wrap">'+esc(docMd)+'</pre>';
    el.querySelectorAll('table').forEach(tb=>{const w=document.createElement('div');w.className='tw';tb.parentNode.insertBefore(w,tb);w.appendChild(tb)});
  }catch(e){const el=document.getElementById('doc'); if(el) el.innerHTML='<p>Het voorstel kon niet worden geladen.</p>'}
}
const SRC={
 home:'Net binnen en de tellers per categorie komen uit de view <b>publiek_artikelen</b> (alleen artikelen met vinkje openbaar en voorraad > 0). Geen prijzen, inkoop of leverancier in die view.',
 partijen:'Catalogus: view <b>publiek_artikelen</b> met de categorieën uit <b>artikel_categorieen</b>. Ingelogd komen daar de artikelen bij die alleen voor klanten zijn, gefilterd op het land van de klant.',
 product:'Productpagina: zelfde adres als nu (<b>/product/&lt;naam&gt;/</b>). Prijs alleen via een serverfunctie die controleert of de ingelogde gebruiker een goedgekeurde klant is.',
 offerte:'Versturen maakt een rij in <b>offertes</b> (status Aanvraag, bron website) met <b>offerte_regels</b> in omdozen. Michel ziet die direct onder Offertes in het Salesbureau.',
 klant:'Aanmelden maakt een prospect in <b>klanten</b>, met KvK, btw en interesses. Pas na goedkeuren in het Salesbureau gaat er een inloglink naar de klant.',
 login:'Inloggen met een inloglink per mail (Supabase Auth). De koppeling login ↔ klant staat in een nieuwe tabel <b>klant_accounts</b>.',
 mijn:'Klantomgeving: toegangsregels in Supabase zorgen dat een klant alleen eigen offertes, orders en gegevens ziet. Persoonlijk aanbod: artikelen die niet openbaar zijn, voor deze klant geselecteerd.',
 aanbieden:'Een aangeboden partij komt bij <b>Opvolging</b> in het Salesbureau als inkoopkans, met de bijlagen in Supabase-opslag.',
 agenda:'Agenda-items komen uit een nieuwe tabel <b>agenda</b>, te beheren in het Salesbureau.',
 contact:'Contactformulier gaat naar <b>Opvolging</b> en als mail naar info@.',
 over:'Vaste tekst in drie talen.',voorstel:'Het voorstel zelf; staat ook als bestand in de projectmap website/voorstel.md.'};
function renderDrawer(){
  document.getElementById('srcinfo').innerHTML=`<b>Op deze pagina</b><br>${SRC[S.route]||''}`;
  document.getElementById('events').innerHTML=S.events.length?S.events.map(e=>`<div class="ev"><div class="when">${e.when} · ${esc(e.table||'')}</div><b>${esc(e.title)}</b>${e.body?`<pre>${esc(e.body)}</pre>`:''}</div>`).join(''):
   '<p class="src">Nog niets gebeurd. Vraag een offerte aan, meld je aan als klant of bied een partij aan: hier zie je wat er in het Salesbureau binnenkomt.</p>';
}
function go(r){S.route=r; if(r!=='product') S.prod=null; if(r!=='offerte') S.sent=null; render(); window.scrollTo({top:0}); try{history.replaceState(null,'',['home','product'].includes(r)?location.pathname:'#'+r)}catch(e){}}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-r],[data-l],[data-cat],[data-sub],[data-p],[data-add],[data-del],[data-q],[data-tab],[data-act]');
  if(!a) return;
  if(a.tagName==='A') e.preventDefault();
  const d=a.dataset;
  if(d.r){ if(d.r==='klant') S.klantSent=false; go(d.r); return }
  if(d.l){S.lang=d.l; render(); return}
  if(d.cat!==undefined){S.cat=d.cat||null; S.sub=null; S.q=''; document.getElementById('q').value=''; go('partijen'); return}
  if(d.sub){S.sub=d.sub; render(); return}
  if(d.p){S.prod=d.p; S.route='product'; render(); window.scrollTo({top:0}); return}
  if(d.q){const i=document.getElementById('qtyin'); i.value=Math.max(1,(+i.value||1)+(+d.q)); i.dispatchEvent(new Event('input')); return}
  if(d.add){const n=Math.max(1,+document.getElementById('qtyin').value||1); S.quote[d.add]=n; render(); return}
  if(d.del){delete S.quote[d.del]; render(); return}
  if(d.tab){S.mijnTab=d.tab; render(); return}
  if(d.act==='logout'){S.user=null; go('home'); return}
  if(d.act==='magic'){log('Inloglink verstuurd naar inkoop@voorbeeld.nl','Supabase Auth stuurt een eenmalige link.\nAlleen als het adres bij een goedgekeurde klant hoort.','auth'); openDrawer(); return}
  if(d.act==='alert'){log('Aanmelding Handel alert','Komt in de Mailchimp-lijst met taal '+S.lang.toUpperCase()+'\nen als prospect in klanten (bron: website).','mailchimp + klanten'); openDrawer(); return}
  if(d.act==='beurs'){log('Afspraakverzoek beurs','Komt bij Opvolging in het Salesbureau.','opvolging'); openDrawer(); return}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('.card')){S.prod=e.target.dataset.p;S.route='product';render()}});
document.addEventListener('input',e=>{
  if(e.target.id==='qtyin'){const x=byId(S.prod),om=parseInt(x.om)||1,n=Math.max(1,+e.target.value||1);document.getElementById('qtyst').textContent=`× ${om} = ${nf(n*om)} ${t('st')}`}
});
document.addEventListener('change',e=>{if(e.target.id==='sortsel'){S.sort=e.target.value;render()}});
document.addEventListener('submit',e=>{
  e.preventDefault();
  const f=e.target;
  if(f.id==='searchform'){S.q=document.getElementById('q').value.trim(); S.cat=null; S.sub=null; go('partijen'); return}
  if(f.id==='offerteform'){
    const nr='OA-2026-'+String(++S.offerteNr).padStart(4,'0');
    const ids=Object.keys(S.quote);
    const bedrag=ids.reduce((a,id)=>{const x=byId(id);return a+x.p*S.quote[id]*(parseInt(x.om)||1)},0);
    const klant=S.user?S.user.naam+' (bestaande klant)':document.getElementById('o-b').value+' (nieuw, KvK '+document.getElementById('o-k').value+')';
    const body=`offertes: nummer ${nr}\n  status: Aanvraag   bron: website\n  klant: ${klant}\n  taal: ${S.lang.toUpperCase()}\nofferte_regels:\n`+ids.map(id=>{const x=byId(id),om=parseInt(x.om)||1;return `  ${id}  ${S.quote[id]} omdoos × ${om} = ${S.quote[id]*om} st.  à ${eur(x.p)}`}).join('\n')+`\nwaarde: ${eur(bedrag)} excl. btw`;
    S.events.unshift({when:new Date().toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'}),title:'Nieuwe offerteaanvraag in het Salesbureau',body,table:'offertes',nr,bedrag:S.user?bedrag:null});
    document.getElementById('evcount').textContent=S.events.length;
    S.quote={}; S.sent=nr; render(); openDrawer(); return}
  if(f.id==='klantform'){
    const v=id=>document.getElementById(id).value;
    const ints=[...f.querySelectorAll('input[type=checkbox]:checked')].map(c=>c.value).join(', ');
    log('Nieuwe aanmelding: wacht op goedkeuring',`klanten: ${v('k-b')}\n  type: prospect   bron: website\n  kvk: ${v('k-k')}   btw: ${v('k-btw')}\n  land: ${v('k-l')}   taal: ${S.lang.toUpperCase()}\n  interesses: ${ints}\nSalesbureau: knop "Goedkeuren" stuurt de inloglink.`,'klanten');
    S.klantSent=true; render(); openDrawer(); return}
  if(f.id==='aanbiedform'){log('Partij aangeboden',`opvolging: inkoopkans\n  van: ${document.getElementById('a-b').value}\n  ${document.getElementById('a-o').value}`,'opvolging'); f.innerHTML='<div class="ok">'+(S.lang==='nl'?'Bedankt, we reageren binnen 48 uur.':'Thank you, we will reply within 48 hours.')+'</div>'; openDrawer(); return}
  if(f.id==='contactform'){log('Contactformulier','opvolging + mail naar info@fvdwpartijhandel.nl','opvolging'); f.innerHTML='<div class="ok">'+(S.lang==='nl'?'Bedankt, we nemen binnen 48 uur contact op.':'Thank you.')+'</div>'; openDrawer(); return}
});
function openDrawer(){document.getElementById('drawer').hidden=false; document.getElementById('go-backstage').setAttribute('aria-pressed','true')}
document.getElementById('go-backstage').onclick=()=>{const d=document.getElementById('drawer');d.hidden=!d.hidden;render()};
document.getElementById('closedrawer').onclick=()=>{document.getElementById('drawer').hidden=true;render()};
document.getElementById('go-voorstel').onclick=()=>go(S.route==='voorstel'?'home':'voorstel');
document.getElementById('logo').onclick=()=>go('home');
document.getElementById('as-guest').onclick=()=>{S.user=null;render()};
document.getElementById('as-nl').onclick=()=>{S.user=USERS.nl;render()};
document.getElementById('as-de').onclick=()=>{S.user=USERS.de;S.lang=S.lang==='nl'?'de':S.lang;render()};

(async()=>{
  try{const r=await fetch('data.json'); D=await r.json();}catch(e){document.getElementById('main').innerHTML='<div class="wrap blk"><p>De voorbeelddata kon niet worden geladen.</p></div>';return}
  const h=(location.hash||'').slice(1); if(V[h]&&h!=='product') S.route=h;
  render();
})();
</script>
